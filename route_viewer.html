<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길벗 - 경로 미리보기</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            height: 70vh;
            width: 100%;
        }

        .info-panel {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .info-panel h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .controls {
            padding: 15px 20px;
            background: #f5f5f5;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
        }

        #result {
            padding: 15px 20px;
            background: #fff;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>

<body>
    <div class="info-panel">
        <h1>🦽 길벗 - 휠체어 경로 미리보기</h1>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="distance">1,911.5m</div>
                <div class="stat-label">거리</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="time">32분</div>
                <div class="stat-label">예상 시간</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="mode">optimal</div>
                <div class="stat-label">모드</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-primary" onclick="searchRoute('shortest')">🚀 최단 경로</button>
        <button class="btn-primary" onclick="searchRoute('safest')">🛡️ 안전 경로</button>
        <button class="btn-primary" onclick="searchRoute('optimal')">⚖️ 최적 경로</button>
        <button class="btn-secondary" onclick="toggleResult()">📋 JSON 보기</button>
    </div>

    <div id="map"></div>
    <pre id="result"></pre>

    <script>
        // 한국공학대 ↔ 정왕역 좌표
        const KOREA_TECH = [37.3401, 126.7315];
        const JEONGWANG = [37.35166, 126.74279];

        // 지도 초기화
        const map = L.map('map').setView([37.3434, 126.7350], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 마커
        const startMarker = L.marker(KOREA_TECH).addTo(map).bindPopup('🏫 한국공학대학교');
        const endMarker = L.marker(JEONGWANG).addTo(map).bindPopup('🚇 정왕역');

        // 경로 레이어
        let routeLayer = null;

        // 초기 경로 (아까 테스트한 결과)
        const initialRoute = [
            [37.3398324, 126.7322196],
            [37.3400384, 126.7327613],
            [37.3406947, 126.7333346],
            [37.3412571, 126.7324818],
            [37.3416653, 126.7329086],
            [37.3418943, 126.7328392],
            [37.3423622, 126.7320654],
            [37.34238, 126.7320446],
            [37.3437069, 126.7332937],
            [37.3438029, 126.7333862],
            [37.3447539, 126.7343085],
            [37.3452437, 126.7347766],
            [37.3457582, 126.7352817],
            [37.3462302, 126.7357285],
            [37.3468525, 126.7363289],
            [37.3469731, 126.7364453],
            [37.3473665, 126.7368249],
            [37.3485765, 126.7380022],
            [37.3499843, 126.739351],
            [37.3500949, 126.7394577],
            [37.3502533, 126.7396186],
            [37.3505835, 126.7399587],
            [37.3514449, 126.7407494],
            [37.3515404, 126.7407438],
            [37.3519823, 126.7409937],
            [37.3516827, 126.7420372],
            [37.3516209, 126.7422523],
            [37.3515747, 126.7427226],
            [37.3515972, 126.7427353]
        ];

        // 경로 그리기
        function drawRoute(geometry, color = '#667eea') {
            if (routeLayer) {
                map.removeLayer(routeLayer);
            }
            routeLayer = L.polyline(geometry, {
                color: color,
                weight: 6,
                opacity: 0.8
            }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
        }

        // 경로 검색
        async function searchRoute(mode) {
            try {
                const response = await fetch('http://localhost:8000/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start_lat: KOREA_TECH[0],
                        start_lon: KOREA_TECH[1],
                        end_lat: JEONGWANG[0],
                        end_lon: JEONGWANG[1],
                        mode: mode
                    })
                });

                const data = await response.json();

                if (data.success && data.route) {
                    drawRoute(data.route.geometry);
                    document.getElementById('distance').textContent = data.route.distance.toFixed(1) + 'm';
                    document.getElementById('time').textContent = data.route.estimated_time + '분';
                    document.getElementById('mode').textContent = mode;
                    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                } else {
                    alert('경로 탐색 실패: ' + data.message);
                }
            } catch (error) {
                alert('서버 연결 실패: ' + error.message);
            }
        }

        function toggleResult() {
            const el = document.getElementById('result');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        // 초기 경로 표시
        drawRoute(initialRoute);
    </script>
</body>

</html>
