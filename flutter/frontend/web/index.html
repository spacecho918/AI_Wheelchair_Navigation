<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gilbeot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>gilbeot</title>
  <link rel="manifest" href="manifest.json">
  <script
          src="//dapi.kakao.com/v2/maps/sdk.js?appkey=6ff3cb082b2de3ee67a2a1e74076eadf&libraries=services,clusterer,drawing"></script>
</head>

<body>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
  <script>
    // Flutter 웹 엔진이 visualViewport resize를 감지해 레이아웃을 축소하는 것을 방지
    (function() {
      if (window.visualViewport) {
        var originalHeight = window.innerHeight;
        // visualViewport resize 이벤트를 가로채서 Flutter에 전파 차단
        window.visualViewport.addEventListener('resize', function(e) {
          e.stopImmediatePropagation();
          // body 높이를 원래 크기로 강제 고정
          document.body.style.height = originalHeight + 'px';
          document.documentElement.style.height = originalHeight + 'px';
        }, true);
      }
      // window resize 시 원본 높이 갱신 (브라우저 창 크기 변경은 허용)
      window.addEventListener('resize', function() {
        if (!document.activeElement || document.activeElement.tagName !== 'INPUT') {
          document.body.style.height = window.innerHeight + 'px';
          document.documentElement.style.height = window.innerHeight + 'px';
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
