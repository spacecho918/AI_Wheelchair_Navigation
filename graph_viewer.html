<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길벗 - 전체 경로 보기</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
        }

        #map {
            height: 80vh;
            width: 100%;
        }

        .info-panel {
            padding: 15px 20px;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
        }

        .info-panel h1 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }

        .stat {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 8px;
        }

        .controls {
            padding: 10px 20px;
            background: #f5f5f5;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
        }

        .btn-active {
            background: #27ae60;
            color: white;
        }

        .legend {
            margin-left: auto;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .color-line {
            width: 20px;
            height: 3px;
        }
    </style>
</head>

<body>
    <div class="info-panel">
        <h1>🗺️ 길벗 - 전체 인도/경로 보기</h1>
        <div class="stats">
            <div class="stat">총 엣지: <strong id="edgeCount">로딩 중...</strong></div>
            <div class="stat">표시 중: <strong id="visibleCount">0</strong>개</div>
        </div>
    </div>
    <div class="controls">
        <button class="btn-primary btn-active" onclick="showAllEdges()">📍 전체 경로</button>
        <button class="btn-secondary" onclick="showByGrade('low')">🟢 완만 (0-5°)</button>
        <button class="btn-secondary" onclick="showByGrade('mid')">🟡 중간 (5-10°)</button>
        <button class="btn-secondary" onclick="showByGrade('high')">🔴 급경사 (10°+)</button>
        <button class="btn-secondary" onclick="clearEdges()">🗑️ 초기화</button>
        <div class="legend">
            <div class="legend-item"><span class="color-line" style="background:#27ae60;"></span> 완만</div>
            <div class="legend-item"><span class="color-line" style="background:#f39c12;"></span> 중간</div>
            <div class="legend-item"><span class="color-line" style="background:#e74c3c;"></span> 급경사</div>
        </div>
    </div>
    <div id="map"></div>

    <script>
        // 지도 초기화
        const map = L.map('map').setView([37.3460, 126.7370], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 마커
        L.marker([37.3401, 126.7315]).addTo(map).bindPopup('🏫 한국공학대학교');
        L.marker([37.35166, 126.74279]).addTo(map).bindPopup('🚇 정왕역');

        let edgesData = [];
        let edgeLayers = [];

        // edges_data.json 로드
        fetch('edges_data.json')
            .then(res => res.json())
            .then(data => {
                edgesData = data;
                document.getElementById('edgeCount').textContent = data.length + '개';
                showAllEdges();
            })
            .catch(err => {
                document.getElementById('edgeCount').textContent = '로드 실패';
                console.error('edges_data.json 로드 실패:', err);
            });

        function getGradeColor(grade) {
            if (grade <= 5) return '#27ae60';  // 녹색 (완만)
            if (grade <= 10) return '#f39c12'; // 주황 (중간)
            return '#e74c3c';                   // 빨강 (급경사)
        }

        function clearEdges() {
            edgeLayers.forEach(layer => map.removeLayer(layer));
            edgeLayers = [];
            document.getElementById('visibleCount').textContent = '0';
        }

        function showAllEdges() {
            clearEdges();
            edgesData.forEach(edge => {
                const line = L.polyline([
                    [edge.start_lat, edge.start_lon],
                    [edge.end_lat, edge.end_lon]
                ], {
                    color: getGradeColor(edge.grade || 0),
                    weight: 3,
                    opacity: 0.7
                }).addTo(map);

                line.bindPopup(`
                    <b>ID:</b> ${edge.edge_id}<br>
                    <b>경사도:</b> ${(edge.grade || 0).toFixed(1)}°<br>
                    <b>거리:</b> ${(edge.length || 0).toFixed(1)}m<br>
                    <b>노면:</b> ${edge.surface_type || 'unknown'}<br>
                    <b>도로:</b> ${edge.highway_type || 'unknown'}
                `);
                edgeLayers.push(line);
            });
            document.getElementById('visibleCount').textContent = edgeLayers.length;
            updateButtons('all');
        }

        function showByGrade(level) {
            clearEdges();
            let filtered = [];

            if (level === 'low') {
                filtered = edgesData.filter(e => (e.grade || 0) <= 5);
            } else if (level === 'mid') {
                filtered = edgesData.filter(e => (e.grade || 0) > 5 && (e.grade || 0) <= 10);
            } else if (level === 'high') {
                filtered = edgesData.filter(e => (e.grade || 0) > 10);
            }

            filtered.forEach(edge => {
                const line = L.polyline([
                    [edge.start_lat, edge.start_lon],
                    [edge.end_lat, edge.end_lon]
                ], {
                    color: getGradeColor(edge.grade || 0),
                    weight: 4,
                    opacity: 0.9
                }).addTo(map);

                line.bindPopup(`
                    <b>ID:</b> ${edge.edge_id}<br>
                    <b>경사도:</b> ${(edge.grade || 0).toFixed(1)}°<br>
                    <b>거리:</b> ${(edge.length || 0).toFixed(1)}m<br>
                    <b>노면:</b> ${edge.surface_type || 'unknown'}
                `);
                edgeLayers.push(line);
            });
            document.getElementById('visibleCount').textContent = edgeLayers.length;
            updateButtons(level);
        }

        function updateButtons(active) {
            document.querySelectorAll('.controls button').forEach(btn => {
                btn.classList.remove('btn-active');
                btn.classList.add('btn-secondary');
            });
            if (active === 'all') {
                document.querySelector('.controls button:first-child').classList.add('btn-active');
            }
        }
    </script>
</body>

</html>
